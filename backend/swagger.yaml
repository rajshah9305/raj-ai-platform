openapi: 3.0.0
info:
  title: RAJ AI Platform API
  version: 1.0.0
  description: API documentation for the RAJ AI Platform.

servers:
  - url: http://localhost:5000
    description: Local server

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        201:
          description: User registered successfully
        400:
          description: User already exists
        500:
          description: Internal server error
  # Additional paths for other endpoints...